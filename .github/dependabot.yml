# Dependabot opens monthly update PRs. Major bumps for Prisma and lucide-react
# require code migrations — ignore them until those are done deliberately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Prisma 7 needs prisma.config.ts, schema changes, and driver adapters.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      backend-production:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@prisma/client"
      backend-development:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "prisma"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # lucide-react 1.x removed brand icons (Instagram, Linkedin, Facebook).
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-production:
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "lucide-react"
      frontend-development:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      worker-aws-sdk:
        patterns:
          - "boto3"
          - "botocore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
