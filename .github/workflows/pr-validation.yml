name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend - Security audit
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Backend - Lint
        working-directory: ./backend
        run: npm run lint || echo "⚠️  Linting not configured"

      - name: Backend - Type check
        working-directory: ./backend
        run: npm run build

      - name: Frontend - Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - Security audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Frontend - Lint
        working-directory: ./frontend
        run: npm run lint || echo "⚠️  Linting not configured"

      - name: Frontend - Type check
        working-directory: ./frontend
        run: npm run build

      - name: Scan backend (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Scan worker (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./worker
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Terraform validate
        working-directory: infrastructure/terraform/environments/us-east-1
        run: |
          terraform init -backend=false
          terraform validate

      - name: Comment on PR
        uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const icon = success ? '✅' : '❌';
            const status = success ? 'All checks passed!' : 'Some checks failed';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${icon} **PR Validation:** ${status}`
            })
