name: Monthly Security Scan

# First run: first Monday of each month (09:00 UTC). No push/PR triggers.

on:
  schedule:
    # First Monday of each month at 09:00 UTC (e.g. 2026-08-03)
    - cron: '0 9 1-7 * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cht_platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend - Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cht_platform

      - name: Backend - Security audit
        working-directory: ./backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Frontend - Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - Security audit
        working-directory: ./frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan backend (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      - name: Scan worker (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./worker
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
