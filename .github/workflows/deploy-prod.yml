name: Deploy to Platform

# Platform (testapp): app deploy only — infra is applied locally via scripts/deploy-platform-infra-local.sh
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: deploy-platform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 233636046512.dkr.ecr.us-east-1.amazonaws.com
  ECR_BACKEND_REPO: cht-platform-backend
  ECR_WORKER_REPO: cht-platform-worker
  TERRAFORM_VERSION: 1.10.5
  APP_URL: https://testapp.communityhealth.media
  API_URL: https://testapp.communityhealth.media/api
  TF_ENV_DIR: infrastructure/terraform/environments/us-east-1
  TF_VAR_FILE: ../variables/platform.github.tfvars
  TF_BACKEND_CONFIG: ../backends/us-east-1-platform.hcl
  ECS_CLUSTER: cht-platform-cluster
  ECS_BACKEND_SERVICE: cht-platform-backend
  ECS_WORKER_SERVICE: cht-platform-worker
  ECS_LOG_GROUP: /ecs/cht-platform
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  gate:
    name: Check deploy trigger
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      checkout_ref: ${{ steps.check.outputs.checkout_ref }}
    steps:
      - name: Evaluate trigger
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
              echo "Trigger: manual workflow_dispatch on ${{ github.ref }}"
              ;;
            pull_request)
              if [ "$PR_MERGED" = "true" ] && [[ "$HEAD_REF" == release/* ]]; then
                echo "should_deploy=true" >> "$GITHUB_OUTPUT"
                echo "checkout_ref=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
                echo "Trigger: merged release PR ($HEAD_REF) → main"
              else
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                echo "checkout_ref=" >> "$GITHUB_OUTPUT"
                echo "Skipped: not a merged release/* pull request to main"
              fi
              ;;
            *)
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=" >> "$GITHUB_OUTPUT"
              ;;
          esac

  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    outputs:
      deploy_backend: ${{ steps.scope.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.scope.outputs.deploy_frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.checkout_ref }}

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || '' }}
          filters: |
            backend:
              - 'backend/**'
              - 'worker/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infrastructure/**'
              - 'scripts/**'
              - '.github/workflows/deploy-dev.yml'
              - '.github/workflows/deploy-prod.yml'

      - name: Set deploy scope
        id: scope
        run: |
          chmod +x scripts/ci-detect-deploy-scope.sh
          ./scripts/ci-detect-deploy-scope.sh \
            "${{ github.event_name }}" \
            "${{ steps.filter.outputs.backend }}" \
            "${{ steps.filter.outputs.frontend }}" \
            "${{ steps.filter.outputs.infra }}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [gate, changes]
    if: |
      needs.gate.outputs.should_deploy == 'true' && (
        needs.changes.outputs.deploy_backend == 'true' ||
        needs.changes.outputs.deploy_frontend == 'true'
      )
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cht_platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - Install dependencies
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: npm ci

      - name: Backend - Generate Prisma client
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cht_platform

      - name: Backend - Run tests
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: npm test

      - name: Frontend - Install dependencies
        if: needs.changes.outputs.deploy_frontend == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - Run tests
        if: needs.changes.outputs.deploy_frontend == 'true'
        working-directory: ./frontend
        run: npm test

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform validate (platform)
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy to Platform
    runs-on: ubuntu-latest
    needs: [gate, changes, test]
    if: |
      needs.gate.outputs.should_deploy == 'true' && (
        needs.changes.outputs.deploy_backend == 'true' ||
        needs.changes.outputs.deploy_frontend == 'true'
      )
    environment: platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}

      - name: Deploy scope summary
        run: |
          echo "## Deploy scope" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lane | Run |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend (ECR images + ECS roll) | ${{ needs.changes.outputs.deploy_backend }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend (build + S3 + CloudFront) | ${{ needs.changes.outputs.deploy_frontend }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ Platform **infrastructure** is applied locally (\`./scripts/deploy-platform-infra-local.sh\`). This workflow deploys app artifacts only." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        if: needs.changes.outputs.deploy_backend == 'true'
        id: meta
        run: |
          chmod +x scripts/next-prod-image-tag.sh
          IMAGE_TAG="$(./scripts/next-prod-image-tag.sh ${{ env.ECR_BACKEND_REPO }} "$AWS_REGION")"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building with tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:platform-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./worker
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:platform-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -reconfigure -backend-config="${{ env.TF_BACKEND_CONFIG }}"

      - name: Verify GitHub Environment secrets (platform)
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true'
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOTRUE_JWT_SECRET: ${{ secrets.GOTRUE_JWT_SECRET }}
          MEDIAHUB_API_KEY: ${{ secrets.MEDIAHUB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_IDS: ${{ secrets.YOUTUBE_PLAYLIST_IDS }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_WEBHOOK_SECRET: ${{ secrets.ZOOM_WEBHOOK_SECRET }}
          ZOOM_SDK_KEY: ${{ secrets.ZOOM_SDK_KEY }}
          ZOOM_SDK_SECRET: ${{ secrets.ZOOM_SDK_SECRET }}
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          BILL_DEV_KEY: ${{ secrets.BILL_DEV_KEY }}
          BILL_USERNAME: ${{ secrets.BILL_USERNAME }}
          BILL_PASSWORD: ${{ secrets.BILL_PASSWORD }}
          BILL_ORG_ID: ${{ secrets.BILL_ORG_ID }}
          BILL_FUNDING_ACCOUNT_ID: ${{ secrets.BILL_FUNDING_ACCOUNT_ID }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          COGNITO_GOOGLE_CLIENT_ID: ${{ secrets.COGNITO_GOOGLE_CLIENT_ID }}
          COGNITO_GOOGLE_CLIENT_SECRET: ${{ secrets.COGNITO_GOOGLE_CLIENT_SECRET }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          CONTENTHUB_API_KEY: ${{ secrets.CONTENTHUB_API_KEY }}
          INTERNAL_CACHE_SECRET: ${{ secrets.INTERNAL_CACHE_SECRET }}
        run: ./scripts/verify-github-env-secrets.sh platform

      - name: Update ECS services
        if: needs.changes.outputs.deploy_backend == 'true'
        run: |
          chmod +x scripts/ecs-update-service-images.sh
          BACKEND_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}" \
          WORKER_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_WORKER_REPO }}:${{ steps.meta.outputs.image_tag }}" \
            ./scripts/ecs-update-service-images.sh platform

      - name: Get Terraform outputs
        if: needs.changes.outputs.deploy_frontend == 'true' || needs.changes.outputs.deploy_backend == 'true'
        id: outputs
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_hosted_ui_base_url=$(terraform output -raw cognito_hosted_ui_base_url)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: needs.changes.outputs.deploy_frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        if: needs.changes.outputs.deploy_frontend == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_APP_URL: ${{ env.APP_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.outputs.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.outputs.outputs.cognito_client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.outputs.outputs.cognito_hosted_ui_base_url }}
          VITE_COGNITO_REGION: ${{ env.AWS_REGION }}
          VITE_MEDIAHUB_AUTH_DECOMMISSIONED: 'true'
          VITE_CATALOG_WORDPRESS_ONLY: 'true'
          VITE_DISABLE_AUTH: 'false'
          VITE_USE_DEV_AUTH: 'false'
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_OAUTH_ENABLED: 'true'
          VITE_SUPABASE_URL: https://mediahub.communityhealth.media
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload to S3
        if: needs.changes.outputs.deploy_frontend == 'true'
        working-directory: ./frontend
        run: |
          aws s3 sync dist/ s3://${{ steps.outputs.outputs.frontend_bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://${{ steps.outputs.outputs.frontend_bucket }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        if: needs.changes.outputs.deploy_frontend == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Health Check (public endpoint)
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true'
        id: healthcheck
        continue-on-error: true
        run: |
          echo "Waiting 60s for deployment to stabilize..."
          sleep 60
          curl -fsS "${{ env.APP_URL }}/health/ready" && echo "✅ /health/ready passed!" || echo "❌ /health/ready failed"
          curl -fsS "${{ env.APP_URL }}/health" && echo "✅ /health passed!" || echo "❌ /health failed"
          curl -fsS -o /dev/null -w "Frontend HTTP %{http_code}\n" "${{ env.APP_URL }}/"

      - name: Diagnostics — ECS task statuses
        if: always() && needs.changes.outputs.deploy_backend == 'true'
        run: |
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_BACKEND_SERVICE }}" "${{ env.ECS_WORKER_SERVICE }}" \
            --query 'services[*].[serviceName,status,desiredCount,runningCount,pendingCount,events[0:3].message]' \
            --output text 2>&1 || echo "describe-services failed"

      - name: Final health gate
        if: (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true') && steps.healthcheck.outcome == 'failure'
        run: |
          echo "Health check failed — see diagnostics above."
          exit 1

      - name: Deployment Summary
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true'
        run: |
          echo "🎉 Platform app deployment complete!"
          echo "Frontend:   ${{ env.APP_URL }}"
          echo "API:        ${{ env.API_URL }}"
          if [ "${{ needs.changes.outputs.deploy_backend }}" = "true" ]; then
            echo "Image Tag:  ${{ steps.meta.outputs.image_tag }}"
          fi
