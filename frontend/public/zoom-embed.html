<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHT Zoom session</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #status {
        flex: 0 0 auto;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.4;
      }
      #status:empty {
        display: none;
      }
      #meetingSDKElement {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
      .err {
        color: #fecaca;
        background: #7f1d1d;
        border-radius: 8px;
        margin: 12px;
        padding: 10px 12px;
      }
      .waiting {
        color: #78350f;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 8px;
        margin: 12px;
        padding: 10px 12px;
      }
    </style>
    <!--
      Zoom Meeting SDK Component View via CDN (ships React 18).
      Must run in this same-origin iframe — host CHT app uses React 19 and conflicts with the SDK.
    -->
    <script src="https://source.zoom.us/4.1.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/4.1.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/4.1.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/4.1.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/4.1.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-embedded-4.1.0.min.js"></script>
  </head>
  <body>
    <div id="status">Preparing Zoom…</div>
    <div id="meetingSDKElement" aria-label="Zoom session"></div>
    <script>
      (function () {
        var STATUS = document.getElementById('status');
        var ROOT = document.getElementById('meetingSDKElement');
        var client = null;
        var joined = false;
        var parentOrigin = (function () {
          try {
            return parent.location.origin;
          } catch (e) {
            return window.location.origin;
          }
        })();

        function setStatus(text, isError, isWaiting) {
          if (!STATUS) return;
          STATUS.textContent = text || '';
          STATUS.className = isWaiting ? 'waiting' : isError ? 'err' : '';
          STATUS.style.display = text ? 'block' : 'none';
        }

        function post(msg) {
          try {
            parent.postMessage(msg, parentOrigin);
          } catch (e) {
            /* ignore */
          }
        }

        function isSdkFailure(r) {
          return r && typeof r === 'object' && 'type' in r && 'reason' in r;
        }

        async function leave() {
          if (!client) return;
          try {
            await client.leaveMeeting();
          } catch (e) {
            /* ignore */
          }
          if (joined) {
            joined = false;
            post({ type: 'cht-zoom-left' });
          }
          client = null;
          setStatus('Left session.');
        }

        async function join(creds) {
          setStatus('Connecting to Zoom…');
          if (!window.ZoomMtgEmbedded) {
            throw new Error('Zoom Meeting SDK failed to load. Check network / CSP.');
          }
          if (client || joined) await leave();

          client = ZoomMtgEmbedded.createClient();
          var initArgs = {
            zoomAppRoot: ROOT,
            language: 'en-US',
            patchJsMedia: true,
          };
          if (!window.crossOriginIsolated) initArgs.disableCORP = true;

          var initResult = await client.init(initArgs);
          if (isSdkFailure(initResult)) {
            throw new Error(initResult.reason || 'Could not start Zoom in the browser.');
          }

          var joinArgs = {
            signature: creds.signature,
            meetingNumber: creds.meetingNumber,
            password: creds.password || '',
            userName: creds.userName,
            userEmail: creds.userEmail || undefined,
          };
          if (creds.sdkKey) joinArgs.sdkKey = creds.sdkKey;
          if (creds.tk) joinArgs.tk = creds.tk;
          if (creds.zak) joinArgs.zak = creds.zak;

          var joinResult = await client.join(joinArgs);
          if (isSdkFailure(joinResult)) {
            throw new Error(joinResult.reason || 'Could not join the session.');
          }

          joined = true;
          setStatus('');
          post({ type: 'cht-zoom-joined' });
        }

        window.addEventListener('message', function (event) {
          if (parentOrigin !== '*' && event.origin !== parentOrigin) return;
          var data = event.data;
          if (!data || typeof data !== 'object') return;

          if (data.type === 'cht-zoom-join') {
            join(data.payload || {}).catch(function (err) {
              var raw = (err && err.message) || '';
              var lower = String(raw).toLowerCase();
              var waiting =
                lower.indexOf('has not started') !== -1 ||
                lower.indexOf('not started') !== -1 ||
                lower.indexOf('waiting for the host') !== -1 ||
                lower.indexOf('waiting for host') !== -1 ||
                lower.indexOf('host has not started') !== -1;
              if (waiting) {
                var waitMsg =
                  'Waiting for the host to start this session. Once they start it in Zoom, click Join in browser again.';
                setStatus(waitMsg, false, true);
                post({ type: 'cht-zoom-error', code: 'waiting_for_host', message: waitMsg });
                return;
              }
              var message =
                raw || 'Could not start in-browser Zoom. Use Open in Zoom if needed.';
              setStatus(message, true, false);
              post({ type: 'cht-zoom-error', message: message });
            });
            return;
          }

          if (data.type === 'cht-zoom-leave') leave();
        });

        post({ type: 'cht-zoom-ready' });
        setStatus('Waiting for session credentials…');
      })();
    </script>
  </body>
</html>
